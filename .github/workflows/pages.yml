# Figma Make 화면 시안(02_제품/화면시안_Make)을 GitHub Pages로 게시
name: Pages · 화면 시안

on:
  push:
    branches: [main]
    paths:
      - "02_제품/화면시안_Make/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "02_제품/화면시안_Make"
      - id: deployment
        uses: actions/deploy-pages@v4
