<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f8f5">
  <title>제주 마케팅 캘린더 · 화면 시안</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23eaf3ec'/%3E%3Ccircle cx='31' cy='36' r='16' fill='%23edaa42'/%3E%3Cpath d='M31 21Q33 8 48 12Q47 25 31 21' fill='%23236447'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<script>
window.addEventListener('load', async () => {
  if (new URLSearchParams(location.search).get('figma-import') !== 'records') return;
  await document.fonts.ready;
  const ready = setInterval(async () => {
    if (!window.figma?.captureForDesign) return;
    clearInterval(ready);
    await window.figma.captureForDesign({captureId:'9eef5b18-0c6f-4248-b9b9-4f828f529d94',endpoint:'https://mcp.figma.com/mcp/capture/9eef5b18-0c6f-4248-b9b9-4f828f529d94/submit?bindVariables=true',selector:'body'});
  }, 500);
});
</script>
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <div id="app"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
