spring.application.name=jeju-calendar

# 실제 접속 정보는 application-local.properties(로컬 전용, Git 제외) 또는 환경변수로 넣음
# 예시 파일: application-local.properties.example
spring.profiles.active=local

# Oracle Database 11g XE (SID 방식: jdbc:oracle:thin:@호스트:포트:SID)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=10000

# 테이블은 db/ 폴더의 SQL을 검토 후 직접 실행함 (앱 시작 시 자동 실행하지 않음)
spring.sql.init.mode=never

# 3개월 홍보 일정표의 시작 월 (화면 시안 기준 2026년 10월부터 12월까지)
calendar.start-month=2026-10

# CSV 업로드 최대 크기 (화면설계서 SCR-A-001 ② 최대 1MB, 요청 전체는 여유를 둠)
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
